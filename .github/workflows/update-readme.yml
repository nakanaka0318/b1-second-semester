name: README を自動更新

# data/courses.js(教材データ)が変わったら、README の科目一覧・教材一覧を作り直してコミットする
on:
  push:
    paths:
      - "data/courses.js"
      - "scripts/build-readme.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-readme.js
      - name: 変更があればコミット
        run: |
          if git diff --quiet README.md; then
            echo "README.md は最新です"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "README の教材一覧を自動更新"
          git push
